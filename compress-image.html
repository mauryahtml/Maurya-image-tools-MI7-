<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MI7 image reduce size in KB</title>

<link rel="stylesheet" href="tool.css">

</head>

<body>

<div class="container">

<h1>MI7 Image Reduce in KB</h1>

<p>Reduce Image in KB</p>

<label for="imageInput" class="uploadBox">

Click Here To Select Image

<input
type="file"
id="imageInput"
accept="image/*"
hidden>

</label>

<img id="preview">




<div class="size-input">
    <input type="number" id="targetSize" placeholder ="100">
    <span class="unit">KB</span>
</div>
  

<button id="compressBtn">

Compress Image

</button>

  <p id="resultInfo"></p>

<button id="downloadBtn">

Download

</button>

<button id="shareBtn">

Share

</button>

<button id="resetBtn">

Reset

</button>

<script src="compress.js"></script>

</div>

</body>

</html>
