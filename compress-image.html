<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MI7 image reduce size in kb / mb</title>

<link rel="stylesheet" href="tool.css">

</head>

<body>

<div class="container">

<h1>MI7 Image Reduce</h1>

<p>Reduce Image in KB or MB</p>

<label for="imageInput" class="uploadBox">

Click Here To Select Image

<input
type="file"
id="imageInput"
accept="image/*"
hidden>

</label>

<img id="preview">

<div class="sizeBox">

<input
type="number"
id="targetSize"
placeholder="Enter Size">

<select id="unit">

<option value="KB">KB</option>

<option value="MB">MB</option>

</select>

</div>

<button id="compressBtn">

Compress Image

</button>

<button id="downloadBtn">

Download

</button>

<button id="shareBtn">

Share

</button>

<button id="resetBtn">

Reset

</button>

<script src="compress.js"></script>

</div>

</body>

</html>
